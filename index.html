<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Ты будешь моей Валентинкой? 💘</title>
  <style>
    /* ——— НЕЖНО-РОЗОВЫЙ, ВОЗДУШНЫЙ, ДЛЯ ТЕЛЕФОНА ——— */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: radial-gradient(circle at 30% 40%, #ffe0e7, #ffccd5);
      font-family: 'Segoe UI', 'Helvetica Neue', 'Apple Color Emoji', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      overflow-x: hidden;
      touch-action: pan-y;
    }

    /* Валентиновая открытка — мягкое стекло */
    .valentine-card {
      max-width: 520px;
      width: 100%;
      background: rgba(255, 240, 243, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 56px 28px 64px 28px;
      box-shadow: 0 25px 40px rgba(247, 120, 140, 0.25),
                  0 0 0 2px rgba(255, 210, 220, 0.7) inset;
      padding: 44px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 20;
      border: 1px solid #ffc0cb;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #a04555;
      text-shadow: 0 4px 8px #ffb7c2, 0 2px 0 #fff0f3;
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-align: center;
      word-break: break-word;
    }

    /* Главный вопрос — ТОЛЬКО ТЕКСТ, без смайликов */
    .question-text {
      font-size: 1.9rem;
      color: #b35d6b;
      background: rgba(255, 255, 255, 0.5);
      padding: 16px 32px;
      border-radius: 80px;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 16px #ffa5b4;
      margin-bottom: 50px;
      font-weight: 700;
      text-align: center;
      border: 2px dashed #ff99aa;
      line-height: 1.4;
      width: 100%;
    }

    /* Зона кнопок */
    .button-area {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 30px 50px;
      width: 100%;
      position: relative;
      min-height: 150px;
      margin-top: 5px;
    }

    /* общие стили кнопок — пухлые, милые */
    .btn {
      border: none;
      background: #ffb3c1;
      color: white;
      font-size: 2.1rem;
      font-weight: bold;
      padding: 18px 44px;
      border-radius: 120px;
      box-shadow: 0 12px 0 #b16a76, 0 18px 30px rgba(255, 100, 130, 0.4);
      letter-spacing: 6px;
      transition: all 0.08s ease;
      cursor: pointer;
      border: 2px solid #fff5f7;
      text-shadow: 0 3px 0 #a7515e;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-shrink: 0;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Кнопка ДА — ещё нежнее */
    .btn-yes {
      background: #ff8f9f;
      box-shadow: 0 12px 0 #b15b68, 0 18px 35px #ff8ca3;
      transform: scale(1.06);
      padding: 20px 52px;
      font-size: 2.3rem;
      border: 3px solid #fff3f5;
    }

    /* Кнопка НЕТ — беглянка */
    .btn-no {
      position: relative;
      background: #da9ca8;
      box-shadow: 0 10px 0 #8e5c64, 0 15px 30px #c47c89;
      padding: 18px 44px;
      font-size: 2.1rem;
      border: 2px solid #ffe1e6;
      transition: left 0.18s cubic-bezier(0.2, 0.85, 0.4, 1.1), 
                  top 0.18s cubic-bezier(0.2, 0.85, 0.4, 1.1),
                  transform 0.1s;
      will-change: left, top;
      z-index: 100;
    }

    /* эффект нажатия только для ДА */
    .btn-yes:active {
      transform: scale(0.98);
      box-shadow: 0 6px 0 #9a515c, 0 12px 30px #f58a9a;
    }

    /* ——— ДЕКОР: сердечки, шарики, конфетти ——— */
    .floating-hearts, .floating-balloons {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
      overflow: hidden;
    }

    .heart, .balloon {
      position: absolute;
      color: rgba(255, 190, 200, 0.8);
      font-size: 2.6rem;
      animation: float 14s infinite ease-in-out;
      text-shadow: 0 6px 15px #ffb0c0;
    }

    .balloon {
      font-size: 3rem;
      color: #ffa7b9;
      animation: floatBalloon 18s infinite alternate;
    }

    @keyframes float {
      0% { transform: translateY(110vh) rotate(0deg); opacity: 0.5; }
      100% { transform: translateY(-20vh) rotate(25deg); opacity: 0; }
    }

    @keyframes floatBalloon {
      0% { transform: translateY(100vh) scale(0.7); opacity: 0.7; }
      100% { transform: translateY(-15vh) scale(1.3); opacity: 0; }
    }

    /* фон из крошечных сердечек (паттерн) */
    .tiny-hearts-bg {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background-image: radial-gradient(circle, #ffb6c1 2px, transparent 2px);
      background-size: 30px 30px;
      opacity: 0.2;
      z-index: 4;
    }

    /* воздушные шары дополнительные */
    .confetti-dots {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: url('data:image/svg+xml;utf8,<svg width="45" height="45" viewBox="0 0 45 45" xmlns="http://www.w3.org/2000/svg"><circle cx="10" cy="12" r="6" fill="%23ffccd5"/><circle cx="35" cy="28" r="7" fill="%23ffd9e2"/><circle cx="18" cy="38" r="5" fill="%23ffc1cc"/><path d="M25 7 L30 16 L20 16 Z" fill="%23fec5ce"/></svg>');
      background-size: 70px 70px;
      opacity: 0.3;
      z-index: 4;
    }

    /* сообщение после нажатия ДА — "Я ТАК И ЗНАЛ" */
    .pop-message {
      background: #ffe2e8;
      color: #a14253;
      padding: 16px 32px;
      border-radius: 60px;
      font-size: 1.9rem;
      font-weight: bold;
      margin-top: 40px;
      border: 4px solid white;
      box-shadow: 0 10px 0 #bf7985;
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 12px;
      animation: pop 0.45s;
      text-align: center;
      width: 100%;
    }

    @keyframes pop {
      0% { transform: scale(0.2); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* маленькие эмодзи внизу — чисто для атмосферы */
    .footer-emoji {
      margin-top: 30px;
      font-size: 2rem;
      color: #c27380;
      opacity: 0.8;
      letter-spacing: 12px;
    }

    /* адаптация для узких экранов */
    @media (max-width: 480px) {
      .valentine-card {
        padding: 30px 16px;
        border-radius: 40px 20px 40px 20px;
      }
      .question-text {
        font-size: 1.6rem;
        padding: 14px 20px;
      }
      h1 { font-size: 1.9rem; }
      .btn { font-size: 1.9rem; padding: 14px 30px; }
      .btn-yes { padding: 16px 42px; font-size: 2.1rem; }
      .btn-no { padding: 14px 30px; }
    }

    /* родитель для absolute кнопки */
    .button-area {
      position: relative;
    }
  </style>
</head>
<body>
  <!-- ДЕКОРАТИВНЫЕ ЭЛЕМЕНТЫ: сердечки, шары, конфетти -->
  <div class="floating-hearts">
    <div class="heart" style="left: 2%; top: 5%; animation-delay: 0s;">❤️</div>
    <div class="heart" style="left: 18%; top: 75%; animation-delay: 2.5s;">💖</div>
    <div class="heart" style="left: 88%; top: 30%; animation-delay: 1.2s;">💘</div>
    <div class="heart" style="left: 40%; top: 15%; animation-delay: 5s;">💗</div>
    <div class="heart" style="left: 72%; top: 85%; animation-delay: 3s;">💓</div>
    <div class="heart" style="left: 55%; top: 50%; animation-delay: 4s;">💞</div>
    <div class="heart" style="left: 93%; top: 70%; animation-delay: 0.8s;">💕</div>
  </div>
  <div class="floating-balloons">
    <div class="balloon" style="left: 8%; animation-delay: 1s;">🎈</div>
    <div class="balloon" style="left: 52%; animation-delay: 2.8s;">🎈</div>
    <div class="balloon" style="left: 76%; animation-delay: 0.2s; font-size: 3.5rem;">🎈</div>
    <div class="balloon" style="left: 28%; animation-delay: 4s;">🎈</div>
    <div class="balloon" style="left: 94%; animation-delay: 1.9s;">🎈</div>
    <div class="balloon" style="left: 15%; animation-delay: 5.5s;">🎈</div>
  </div>
  <div class="tiny-hearts-bg"></div>
  <div class="confetti-dots"></div>

  <!-- ЦЕНТРАЛЬНАЯ ВАЛЕНТИНКА -->
  <div class="valentine-card">
    <h1>💘 14 февраля 💘</h1>
    
    <!-- ТЕКСТ ВОПРОСА: ЧЁТКО ПО ЦЕНТРУ, БЕЗ ЛИШНИХ СМАЙЛИКОВ -->
    <div class="question-text">
      Ты будешь моей валентинкой?
    </div>

    <!-- КНОПОЧНАЯ ЗОНА -->
    <div class="button-area" id="buttonArea">
      <button class="btn btn-yes" id="yesBtn">ДА 💞</button>
      <button class="btn btn-no" id="noBtn">НЕТ 💔</button>
    </div>

    <!-- СООБЩЕНИЕ: "Я ТАК И ЗНАЛ" (МУЖСКОЙ РОД) -->
    <div id="loveMessage" class="pop-message">
      <span>❤️ Я ТАК И ЗНАЛ! ❤️</span>
    </div>
    
    <div class="footer-emoji">
      💝 🎈 💖
    </div>
  </div>

  <script>
    (function() {
      "use strict";

      const noBtn = document.getElementById('noBtn');
      const yesBtn = document.getElementById('yesBtn');
      const loveMsg = document.getElementById('loveMessage');
      const area = document.getElementById('buttonArea');

      // ПЕРЕМЕННЫЕ ДЛЯ ПОЗИЦИЙ
      let areaRect = area.getBoundingClientRect();
      let btnRect = noBtn.getBoundingClientRect();

      // ПОЛНОСТЬЮ БЛОКИРУЕМ ЛЮБОЕ НАЖАТИЕ НА "НЕТ"
      const preventClick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        return false;
      };

      noBtn.addEventListener('click', preventClick);
      noBtn.addEventListener('touchstart', (e) => {
        e.preventDefault(); // отмена нажатия
        // принудительно двигаем от касания
        moveNoButtonFromCursor(e);
      }, { passive: false });

      noBtn.addEventListener('mousedown', (e) => e.preventDefault());

      // ОСНОВНАЯ ЛОГИКА УБЕГАНИЯ
      function moveNoButtonFromCursor(e) {
        let clientX, clientY;
        if (e.touches) {
          clientX = e.touches[0].clientX;
          clientY = e.touches[0].clientY;
        } else {
          clientX = e.clientX;
          clientY = e.clientY;
        }

        areaRect = area.getBoundingClientRect();
        btnRect = noBtn.getBoundingClientRect();

        const btnWidth = btnRect.width;
        const btnHeight = btnRect.height;
        const btnCenterX = btnRect.left + btnWidth / 2;
        const btnCenterY = btnRect.top + btnHeight / 2;

        const deltaX = clientX - btnCenterX;
        const deltaY = clientY - btnCenterY;
        const avoidance = 150; // сила убегания

        let moveX = 0, moveY = 0;

        if (Math.abs(deltaX) < 0.5 && Math.abs(deltaY) < 0.5) {
          // если указатель прямо по центру — прыжок вниз и вправо
          moveX = 100;
          moveY = 80;
        } else {
          const length = Math.hypot(deltaX, deltaY);
          const dirX = deltaX / length;
          const dirY = deltaY / length;
          moveX = -dirX * avoidance;
          moveY = -dirY * avoidance;
        }

        // текущее положение (левый верхний угол)
        let currentLeft = parseFloat(noBtn.style.left) || 0;
        let currentTop = parseFloat(noBtn.style.top) || 0;

        // если стиль не задан, вычисляем на основе getBoundingClientRect
        if (!noBtn.style.left || noBtn.style.left === 'auto') {
          currentLeft = btnRect.left - areaRect.left;
          currentTop = btnRect.top - areaRect.top;
        }

        let newLeft = currentLeft + moveX;
        let newTop = currentTop + moveY;

        // мягкие границы: можно немного за край, но не пропадать совсем
        const maxLeft = areaRect.width - btnWidth * 0.3;
        const maxTop = areaRect.height - btnHeight * 0.3;
        const minLeft = -btnWidth * 0.3;
        const minTop = -btnHeight * 0.3;

        newLeft = Math.min(Math.max(newLeft, minLeft), maxLeft);
        newTop = Math.min(Math.max(newTop, minTop), maxTop);

        noBtn.style.left = newLeft + 'px';
        noBtn.style.top = newTop + 'px';
        noBtn.style.position = 'absolute';
      }

      // СТАРТОВАЯ ПОЗИЦИЯ — справа от кнопки ДА
      function setInitialPosition() {
        areaRect = area.getBoundingClientRect();
        btnRect = noBtn.getBoundingClientRect();
        const yesBtnRect = yesBtn.getBoundingClientRect();
        // ставим НЕТ правее, но в пределах области
        let startLeft = areaRect.width - btnRect.width - 15;
        if (startLeft < yesBtnRect.width + 20) {
          startLeft = areaRect.width - btnRect.width - 10;
        }
        noBtn.style.left = startLeft + 'px';
        noBtn.style.top = '5px';
      }

      window.addEventListener('load', setInitialPosition);
      window.addEventListener('resize', function() {
        areaRect = area.getBoundingClientRect();
        let currentL = parseFloat(noBtn.style.left) || 0;
        let currentT = parseFloat(noBtn.style.top) || 0;
        // корректировка при ресайзе
        if (currentL > areaRect.width - 20) currentL = areaRect.width - btnRect.width - 15;
        if (currentT > areaRect.height - 20) currentT = areaRect.height - btnRect.height - 15;
        if (currentL < -20) currentL = 5;
        if (currentT < -20) currentT = 5;
        noBtn.style.left = currentL + 'px';
        noBtn.style.top = currentT + 'px';
      });

      // ПРИ ДВИЖЕНИИ МЫШИ/ПАЛЬЦА В ОБЛАСТИ — убегание
      area.addEventListener('mousemove', moveNoButtonFromCursor);
      area.addEventListener('touchmove', function(e) {
        moveNoButtonFromCursor(e);
        e.preventDefault();
      }, { passive: false });

      area.addEventListener('touchstart', function(e) {
        moveNoButtonFromCursor(e);
        // не блокируем полностью, чтобы не мешать скроллу совсем чуть-чуть
      }, { passive: false });

      // ОБРАБОТКА КНОПКИ "ДА"
      function showLoveMessage() {
        loveMsg.style.display = 'flex';
        yesBtn.style.transform = 'scale(0.95)';
        setTimeout(() => { yesBtn.style.transform = 'scale(1.06)'; }, 150);
        // скрываем через 3.5 секунды
        setTimeout(() => {
          loveMsg.style.display = 'none';
        }, 3500);
      }

      yesBtn.addEventListener('click', showLoveMessage);
      yesBtn.addEventListener('touchend', function(e) {
        e.preventDefault(); // без двойного клика
        showLoveMessage();
      });

      // финальная защита: если всё же попытаются нажать на НЕТ через нативный клик
      noBtn.addEventListener('touchstart', (e) => {
        e.preventDefault();
        moveNoButtonFromCursor(e);
      }, { passive: false });

      // также вешаем глобальный обработчик на document, чтобы случайно не нажали
      document.addEventListener('touchstart', function(e) {
        if (e.target === noBtn || noBtn.contains(e.target)) {
          e.preventDefault();
        }
      }, { passive: false });

    })();
  </script>

  <!-- гарантия позиционирования -->
  <style>
    .button-area {
      position: relative;
    }
    .btn-no {
      transition: left 0.18s cubic-bezier(0.22, 0.9, 0.45, 1.1), top 0.18s cubic-bezier(0.22, 0.9, 0.45, 1.1);
    }
    .pop-message {
      display: none; /* изначально скрыто */
    }
    .question-text {
      font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
    }
  </style>
</body>
</html>
